name: AI-usage
options:
  bundleIdPrefix: com.tomasbartos
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  AI-usage:
    type: application
    platform: macOS
    sources:
      - path: AIUsage
    info:
      path: AIUsage/Resources/Info.plist
      properties:
        CFBundleDisplayName: AI-usage
        CFBundleName: AI-usage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: Copyright © 2026 Tomas Bartos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomasbartos.AIUsage
        PRODUCT_NAME: AI-usage
        PRODUCT_MODULE_NAME: AIUsage
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
  AIUsageTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AIUsageTests
    dependencies:
      - target: AI-usage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomasbartos.AIUsageTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AI-usage.app/Contents/MacOS/AI-usage
schemes:
  AI-usage:
    build:
      targets:
        AI-usage: all
        AIUsageTests: [test]
    test:
      targets:
        - AIUsageTests
      gatherCoverageData: false
    run:
      config: Debug
